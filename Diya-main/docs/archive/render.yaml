# Render blueprint — one web service (API + registration site) + a Postgres DB.
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. Render Dashboard -> New -> Blueprint -> pick this repo.
#   3. Render reads this file and creates both resources.
#
# IMPORTANT (free tier):
#   * The free web service sleeps after ~15 min idle (first request cold-starts ~30-50s).
#   * Render's FREE Postgres is DELETED after 30 days. For a database that persists,
#     create a free Neon/Supabase Postgres instead and set DATABASE_URL manually
#     (remove the `databases:` block and the `fromDatabase` mapping below).

services:
  - type: web
    name: diya-registration
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diya-db
          property: connectionString
      # hosted Postgres needs SSL (the default); never set PGSSL=disable here

databases:
  - name: diya-db
    plan: free
    databaseName: diya
    user: diya
